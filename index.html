<meta name="viewport" content="width=device-width,initial-scale=1">

<title>戦コレツール</title>
<style>
  :root{--gold:#8B2E2E;--head:#F2C9C9;--gcol:#FBE3E3;--rowb:#FBF1F1;--border:#B09090;--text:#333;--sub:#6E2020;--plus:#1F5FBF;--minus:#C0392B;--panel:#FFF3F3;--bg:#fff;--muted:#8A8A8A;--ok:#DDF2E3;--ng:#FBDDDD;--mid:#FFF0B3}
  *{box-sizing:border-box}
  body{color-scheme:light;margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",system-ui,sans-serif;font-size:14px;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}
  h1{background:var(--gold);color:#fff;font-size:18px;margin:0 -14px 0;padding:14px;text-align:center}
  .meta{background:var(--panel);border:1px solid var(--border);border-top:none;padding:6px;text-align:center;font-size:11.5px;color:var(--sub);margin:0 -14px 14px}
  h2{font-size:15px;color:var(--sub);border-left:5px solid var(--gold);padding-left:9px;margin:20px 0 8px}
  .card{border:1px solid var(--border);border-radius:5px;padding:12px;background:#fff;margin-bottom:8px}
  .layer{border:1px solid var(--border);border-radius:4px;padding:8px 10px;background:var(--panel);margin-bottom:8px}
  .layer .h{font-size:11.5px;color:var(--sub);font-weight:bold;margin-bottom:4px}
  .layer .d{font-size:11px;color:#666;margin-top:4px;line-height:1.5}
  select:disabled{color:var(--muted);background:#f4f4f4}
  select{width:100%;padding:8px 8px;border:1px solid var(--border);border-radius:4px;font-size:15px;font-family:inherit;background:#fff}
  .status{border-left:5px solid var(--border);padding:6px 10px;margin:8px 0 0;font-size:14px;font-weight:bold;background:#f6f6f6;border-radius:0 4px 4px 0}
  .status.go{border-color:var(--plus);background:var(--ok)} .status.stop{border-color:var(--minus);background:var(--ng)} .status.wait{border-color:#C79A00;background:var(--mid)} .status.na{color:#777}
  .sub{font-size:12px;color:var(--muted);margin:4px 0 0}
  .rule{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:7px 9px;margin:8px 0 0}
  .note{font-size:12px;color:#555;line-height:1.55;margin:6px 0 0}
  table{border-collapse:collapse;width:100%;font-size:13px} th{background:var(--head);color:#5A2020;border:1px solid var(--border);padding:5px 4px;font-size:12px;white-space:nowrap}
  td{border:1px solid var(--border);padding:5px 4px;text-align:center} tbody tr:nth-child(even){background:var(--rowb)}
  td.pos{background:var(--ok);color:var(--plus);font-weight:bold} td.neg{background:var(--ng);color:var(--minus);font-weight:bold}
  details{margin:8px 0} summary{cursor:pointer;color:var(--sub);font-size:13.5px;font-weight:bold;padding:4px 0}
  @media (max-width:640px){
    .wrap{padding:0 8px 40px} h1{font-size:16px;padding:11px 8px;margin:0 -8px} .meta{margin:0 -8px 10px;font-size:10.5px;padding:5px}
    h2{font-size:14px;margin:16px 0 6px} .card{padding:9px} .layer{padding:7px 8px}
    .status{font-size:13px} .rule{font-size:11.5px}
    table{font-size:11.5px} th,td{padding:4px 2px} th{font-size:10.5px}
  }
</style>
</head>

   "hi": 1250,
   "pol": "S2"
  },
  {
   "code": "m1",
   "label": "1250〜1400",
   "lo": 1250,
   "hi": 1400,
   "pol": "S2"
  },
  {
   "code": "m2",
   "label": "1400〜1600",
   "lo": 1400,
   "hi": 1600,
   "pol": "S2"
  },
  {
   "code": "m3",
   "label": "1600〜1900",
   "lo": 1600,
   "hi": 1900,
   "pol": "S2"
  },
  {
   "code": "mall",
   "label": "1200〜1900 全体",
   "lo": 1200,
   "hi": 1900,
   "pol": "S2"
  },
  {
   "code": "m9",
   "label": "1900 以上",
   "lo": 1900,
   "hi": 99999,
   "pol": "S2"
  }
 ]
}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const M = DATA.meta; const YEN = M.yen_per_coin; const GATES = M.gates || { a: -500, c: -500, r: -1500 };
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => (v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d));
const yen = v => (v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * YEN)).toLocaleString() + '円');
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');
const rcls = r => r == null ? '' : (r >= 100 ? 'pos' : 'neg');
$('meta').textContent = `本形式${M.n_honkei_days}日(${M.honkei_days[0].slice(5)}〜${M.honkei_days[M.honkei_days.length-1].slice(5)}) | 円 = 20倍 | ${M.built}`;
const GR = {}; DATA.grid.forEach(e => { GR[e.my + '|' + e.sink + '|' + e.k + '|' + (e.ori || 'a')] = e; });
const MYL = Object.fromEntries(DATA.grid_my.map(b => [b.code, b]));
const ORIL = { a: '朝イチ', c: '切断後', r: 'MY 2000 到達後' };
const gateTxt = o => `${Math.abs(GATES[o])}枚`;
const RULE_S2 = '打ち方: 当たるまで打つ。当たりの後、MY が 1200〜1900 なら続行。ループらしくない当たり(単発・1セット目 220 未満の 2連・4連型なのに 3連止まり)で MY が 1200 を割ったらヤメ、ループらしくない当たりが通算 2 回でヤメ、MY 1900 到達・切断(上位・ED)でヤメ。6連以上の後は天国の当たりを 1 回取ってからヤメる。';
const RULE_B = '打ち方: 当たるまで打つ。MY が 1200 に届いたら上の続行ルールへ。届かなくても MY が 1000 以上なら再び打つ。1000 を割ったらヤメ。';
function fillSink() {
  const o = $('ori').value, keep = $('sink').value || 's12';
  $('sink').innerHTML = `<option value="s12">−${gateTxt(o)} 未満</option><option value="s3">−${gateTxt(o)} 以上</option>`;
  $('sink').value = keep; $('gateLab').textContent = `(この基準点では線は −${gateTxt(o)})`;
}
['my', 'sink'].forEach(id => $(id).addEventListener('change', render));
$('ori').addEventListener('change', () => { fillSink(); render(); });
function clear_() { $('kpiSub').textContent = ''; $('ruleLine').textContent = ''; $('ruleLine').style.display = 'none'; $('kmBox').innerHTML = ''; }
function kmTable(rows, pre) {
  let k = `<table><thead><tr><th>着席G</th><th>サンプル数</th><th>初当り</th><th>${pre ? '点火率' : 'RUSH_TY'}</th><th>期待値(円)</th><th>ROI%</th></tr></thead><tbody>`;
  Object.keys(rows).map(Number).sort((x, y) => x - y).forEach(gk => { const r = rows[gk]; k += `<tr><td style="background:var(--gcol);font-weight:bold">${gk}G</td><td>${r.n.toLocaleString()}</td><td>${r.hit ? '1/' + r.hit : '—'}</td><td>${pre ? (r.ignite == null ? '—' : r.ignite.toFixed(0) + '%') : (r.ty == null ? '—' : r.ty)}</td><td class="${cls(r.ev)}">${yen(r.ev)}</td><td class="${rcls(r.roi)}">${r.roi.toFixed(1)}</td></tr>`; });
  return k + '</tbody></table>';
}
function render() {
  const my = $('my').value, sk = $('sink').value, o = $('ori').value, gv = $('gateV');
  const myTxt = $('my').selectedOptions[0].textContent, gt = gateTxt(o), oTxt = ORIL[o];
  $('my').disabled = sk === 's3';
  if (sk === 's3') {   // 対象外: MY を問わず 1200〜1900 全体の表(弱さの確認用)
    const e = GR['mall|s3|all|' + o];
    gv.className = 'status stop'; gv.textContent = `${oTxt}・最下点 −${gt} 以上: ループは立ち上がらない(通常の台と同じ)。MY に関係なく対象外`;
    if (!e || !e.rows) { $('kpiSub').textContent = `該当が少なく表なし(本形式 n=${e ? e.n : 0})`; $('ruleLine').style.display = 'none'; $('kmBox').innerHTML = ''; return; }
    const r0 = e.rows[0] || e.rows['0'];
    $('kpiSub').textContent = `MY 1200〜1900 の席をまとめた値(本形式9日 n=${r0.n.toLocaleString()}、次が3連以上 ${e.next3 == null ? '—' : e.next3.toFixed(0) + '%'})。ループ狙いの打ち方で最後まで打っても、この水準。`;
    $('ruleLine').style.display = ''; $('ruleLine').textContent = '弱さの確認用: ' + RULE_S2;
    $('kmBox').innerHTML = kmTable(e.rows, false) + '<p class="sub">線より浅い台は MY が帯の中でもループが立ち上がらない。深い着席G でプラスになるのはハマるほど次の当たりが近づく分の価値(通常の台と同じ)。</p>';
    return;
  }
  const e = GR[my + '|' + sk + '|all|' + o], pre = MYL[my].pol === 'B';
  if (!e || !e.rows) { gv.className = 'status na'; gv.textContent = `${oTxt}・MY ${myTxt}: 該当が少なく表なし(本形式 n=${e ? e.n : 0})`; clear_(); return; }
  const r0 = e.rows[0] || e.rows['0'];
  if (pre) { gv.className = 'status wait'; gv.textContent = `${oTxt}・MY ${myTxt}: 未点火。1200 到達狙い(点火率 ${r0.ignite == null ? '—' : r0.ignite.toFixed(0) + '%'})`; }
  else if (my === 'm9') { gv.className = 'status stop'; gv.textContent = `${oTxt}・MY 1900 以上: 上限到達。ヤメ(この後は通常の台に戻る)。下は続けた場合の参考`; }
  else if (my === 'mx') { gv.className = 'status wait'; gv.textContent = `${oTxt}・MY 1200〜1250: 誤差で未達が混ざる帯(次が3連以上 ${e.next3 == null ? '—' : e.next3.toFixed(0) + '%'})`; }
  else { gv.className = 'status go'; gv.textContent = `${oTxt}・最下点 −${gt} 未満・MY ${myTxt}: ループ狙い(次が3連以上 ${e.next3 == null ? '—' : e.next3.toFixed(0) + '%'})`; }
  $('kpiSub').textContent = `本形式9日 n=${r0.n.toLocaleString()}。最適と思われる打ち方で最後まで打った場合の純増(繋ぎ 8G 込み)。${o !== 'a' ? '基準点が' + oTxt + 'の席は数が少ないので目安。' : ''}`;
  $('ruleLine').style.display = ''; $('ruleLine').textContent = (my === 'm9' ? '参考(採用案では 1900 到達でヤメ)。続けた場合: ' : '') + (pre ? RULE_B + ' ' + RULE_S2 : RULE_S2);
  $('kmBox').innerHTML = kmTable(e.rows, pre) + `<p class="sub">着席G = その時点から打ち始めた場合(それまでの消化分は含まない)。初当り${pre ? '' : '・RUSH_TY'}は 1 回目の当たりの値${pre ? '、点火率 = その席から 1200 に届く率' : ''}。</p>`;
}
$('terms').innerHTML = `<b>基準点(⓪)</b>: 差枚を 0 とみなす点。朝イチの 0、当日に切断(上位 AT・ED)があればその時点、MY 2000 到達があればその到達点。複数あれば最後のもの。<br>
<b>最下点(①)</b>: 基準点以降で当日差枚がいちばん低くなった点。① の値 = 基準点から見た最下点の差枚。線は基準点の種類で変わる: 朝イチ −500 / 切断後 −500 / MY 2000 到達後 −1500(2026-09-23 決定)。線より浅い台はループが立ち上がらない(対象外の表は弱さの確認用)。<br>
<b>MY(②)</b>: 最下点から現在までの当日差枚の上げ幅。1200 で点火、1900 でヤメ(真の上限は 2000、推定は 50 枚ほど低く出る)。<br>
<b>ループらしくない当たり</b>: 単発、1セット目 220 未満の 2連、4連型(1・2 セット目 140 未満)なのに 3連止まり。<br>
<b>${RULE_S2}</b><br><b>MY 1200 未満: ${RULE_B}</b><br><br>
数値は本形式9日(${M.honkei_days.join('、')})の実戦データで、同じデータで発見して評価した値(in-sample)。差枚は推定値(通常時 ${M.jungen}枚/G、AT 純増 3.0)。記録不良のセッションは除外。切断後・MY 2000 到達後の表は該当が少なく、n が 30 未満の着席G は表に出ない。`;
fillSink(); render();
</script>
</body>
</html>
