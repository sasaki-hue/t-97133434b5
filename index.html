<style>
  :root{--gold:#8B2E2E;--head:#F2C9C9;--gcol:#FBE3E3;--rowb:#FBF1F1;--border:#B09090;--text:#333;--sub:#6E2020;--plus:#1F5FBF;--minus:#C0392B;--panel:#FFF3F3;--bg:#fff;--muted:#8A8A8A;--ok:#DDF2E3;--ng:#FBDDDD;--mid:#FFF0B3}
  *{box-sizing:border-box}
  body{color-scheme:light;margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",system-ui,sans-serif;font-size:14px;line-height:1.55}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}
  h1{background:var(--gold);color:#fff;font-size:18px;margin:0 -14px 0;padding:14px;text-align:center}
  .meta{background:var(--panel);border:1px solid var(--border);border-top:none;padding:6px;text-align:center;font-size:11.5px;color:var(--sub);margin:0 -14px 14px}
  h2{font-size:15px;color:var(--sub);border-left:5px solid var(--gold);padding-left:9px;margin:20px 0 8px}
  .card{border:1px solid var(--border);border-radius:5px;padding:12px;background:#fff;margin-bottom:8px}
  .layer{border:1px solid var(--border);border-radius:4px;padding:8px 10px;background:var(--panel);margin-bottom:8px}
  .layer .h{font-size:11.5px;color:var(--sub);font-weight:bold;margin-bottom:4px}
  select:disabled{color:var(--muted);background:#f4f4f4}
  select{width:100%;padding:8px 8px;border:1px solid var(--border);border-radius:4px;font-size:15px;font-family:inherit;background:#fff}
  .status{border-left:5px solid var(--border);padding:6px 10px;margin:8px 0 0;font-size:14px;font-weight:bold;background:#f6f6f6;border-radius:0 4px 4px 0}
  .status.go{border-color:var(--plus);background:var(--ok)} .status.stop{border-color:var(--minus);background:var(--ng)} .status.wait{border-color:#C79A00;background:var(--mid)} .status.na{color:#777}
  .kpi{display:flex;gap:8px;margin:8px 0 4px} .kpi div{flex:1;border:1px solid var(--border);border-radius:4px;padding:8px 4px;text-align:center;background:var(--panel)}
  .kpi .v{display:block;font-size:21px;font-weight:bold;line-height:1.25;color:var(--sub)} .kpi .k{font-size:11px;color:var(--sub)} .kpi div.pos{background:var(--ok)} .kpi div.pos .v{color:var(--plus)} .kpi div.neg{background:var(--ng)} .kpi div.neg .v{color:var(--minus)}
  .sub{font-size:12px;color:var(--muted);margin:4px 0 0}
  .rule{font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:7px 9px;margin:8px 0 0}
  .note{font-size:12px;color:#555;line-height:1.55;margin:6px 0 0}
  table{border-collapse:collapse;width:100%;font-size:13px} th{background:var(--head);color:#5A2020;border:1px solid var(--border);padding:5px 4px;font-size:12px;white-space:nowrap}
  td{border:1px solid var(--border);padding:5px 4px;text-align:center} tbody tr:nth-child(even){background:var(--rowb)}
  td.pos{background:var(--ok);color:var(--plus);font-weight:bold} td.neg{background:var(--ng);color:var(--minus);font-weight:bold}
  details{margin:8px 0} summary{cursor:pointer;color:var(--sub);font-size:13.5px;font-weight:bold;padding:4px 0}
  @media (max-width:640px){
    .wrap{padding:0 8px 40px} h1{font-size:16px;padding:11px 8px;margin:0 -8px} .meta{margin:0 -8px 10px;font-size:10.5px;padding:5px}
    h2{font-size:14px;margin:16px 0 6px} .card{padding:9px} .layer{padding:7px 8px}
    .status{font-size:13px} .kpi .v{font-size:19px} .kpi .k{font-size:10.5px} .rule{font-size:11.5px}
    table{font-size:11.5px} th,td{padding:4px 2px} th{font-size:10.5px}
  }
</style>
</head>

  },
  {
   "code": "p4",
   "label": "1100〜1200",
   "lo": 1100,
   "hi": 1200,
   "pol": "B"
  },
  {
   "code": "mx",
   "label": "1200〜1250",
   "lo": 1200,
   "hi": 1250,
   "pol": "S2"
  },
  {
   "code": "m1",
   "label": "1250〜1400",
   "lo": 1250,
   "hi": 1400,
   "pol": "S2"
  },
  {
   "code": "m2",
   "label": "1400〜1600",
   "lo": 1400,
   "hi": 1600,
   "pol": "S2"
  },
  {
   "code": "m3",
   "label": "1600〜1900",
   "lo": 1600,
   "hi": 1900,
   "pol": "S2"
  }
 ]
}</script>
<script>
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const M = DATA.meta; const YEN = M.yen_per_coin;
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => (v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(d));
const yen = v => (v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(Math.round(v * YEN)).toLocaleString() + '円');
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');
const rcls = r => r == null ? '' : (r >= 100 ? 'pos' : 'neg');
$('meta').textContent = `本形式${M.n_honkei_days}日(${M.honkei_days[0].slice(5)}〜${M.honkei_days[M.honkei_days.length-1].slice(5)}) | 円 = 20倍 | ${M.built}`;
const GR = {}; DATA.grid.forEach(e => { GR[e.my + '|' + e.sink] = e; });
const MYL = Object.fromEntries(DATA.grid_my.map(b => [b.code, b])); const SKL = { s1: '−1000 以下', s2: '−1000〜−500', s3: '−500 以上' };
const RULE_S2 = '打ち方: 当たるまで打つ。当たりの後、MY が 1200〜1900 なら続行。外れ(単発・1セット目 220 未満の 2連)で MY が 1200 を割ったらヤメ、外れが通算 2 回でヤメ、MY 1900 到達・切断(上位・ED)でヤメ。6連以上の後は天国 1 本を取る。';
const RULE_B = '打ち方: 当たるまで打つ。MY が 1200 に届いたら上の続行ルールへ。届かなくても MY が 1000 以上なら再び打つ。1000 を割ったらヤメ。';
['my', 'sink'].forEach(id => $(id).addEventListener('change', render));
function clear_() { $('kpi').innerHTML = ''; $('kpiSub').textContent = ''; $('ruleLine').textContent = ''; $('kmBox').innerHTML = ''; }
function kmTable(rows, pre) {
  let k = `<table><thead><tr><th>着席G</th><th>サンプル数</th><th>初当り</th><th>${pre ? '点火率' : 'RUSH_TY'}</th><th>期待値(円)</th><th>ROI%</th></tr></thead><tbody>`;
  Object.keys(rows).map(Number).sort((x, y) => x - y).forEach(gk => { const r = rows[gk]; k += `<tr><td style="background:var(--gcol);font-weight:bold">${gk}G</td><td>${r.n.toLocaleString()}</td><td>${r.hit ? '1/' + r.hit : '—'}</td><td>${pre ? (r.ignite == null ? '—' : r.ignite.toFixed(0) + '%') : (r.ty == null ? '—' : r.ty)}</td><td class="${cls(r.ev)}">${yen(r.ev)}</td><td class="${rcls(r.roi)}">${r.roi.toFixed(1)}</td></tr>`; });
  return k + '</tbody></table>';
}
function render() {
  const my = $('my').value, sk = $('sink').value, gv = $('gateV');
  $('my').disabled = sk === 's3';
  if (sk === 's3') { gv.className = 'status stop'; gv.textContent = '最下点 −500 以上: ループは立ち上がらない(通常の台と同じ)。MY に関係なく対象外'; clear_(); return; }
  if (!sk) { gv.className = 'status na'; gv.textContent = '①を選んでください'; clear_(); return; }
  if (my === 'm9') { gv.className = 'status stop'; gv.textContent = 'MY 1900 以上: 上限到達。ヤメ(この後は通常の台に戻る)'; clear_(); return; }
  if (!my) { gv.className = 'status na'; gv.textContent = '②を選んでください'; clear_(); return; }
  const e = GR[my + '|' + sk], pre = MYL[my].pol === 'B', gateOK = sk === 's1' || sk === 's2';
  if (!e || !e.rows) { gv.className = 'status na'; gv.textContent = `該当が少なく数値なし(本形式 n=${e ? e.n : 0})`; clear_(); return; }
  const r0 = e.rows[0] || e.rows['0'];
  if (!gateOK) { gv.className = 'status stop'; gv.textContent = `最下点 ${SKL[sk]}: ループは立ち上がらない(通常の台と同じ)`; }
  else if (pre) { gv.className = 'status wait'; gv.textContent = `MY ${MYL[my].label}: 未点火。1200 到達狙い`; }
  else if (my === 'mx') { gv.className = 'status wait'; gv.textContent = 'MY 1200〜1250: 誤差で未達が混ざる帯'; }
  else { gv.className = 'status go'; gv.textContent = `MY ${MYL[my].label}・最下点 ${SKL[sk]}: ループ狙い`; }
  const third = pre ? [`${r0.ignite == null ? '—' : r0.ignite.toFixed(0) + '%'}`, '1200 に届く率', r0.ignite >= 30 ? 'pos' : r0.ignite < 10 ? 'neg' : ''] : [`${e.next3 == null ? '—' : e.next3.toFixed(0) + '%'}`, '次が3連以上', e.next3 >= 60 ? 'pos' : e.next3 < 45 ? 'neg' : ''];
  $('kpi').innerHTML = [[yen(r0.ev), `0G 着席の期待値(${fmt(r0.ev)}枚)`, cls(r0.ev)], [`${r0.roi.toFixed(1)}%`, `ROI(投資 ${Math.round(r0.g)}G)`, rcls(r0.roi)], third].map(([a, b, c]) => `<div class="${c}"><span class="v">${a}</span><span class="k">${b}</span></div>`).join('');
  $('kpiSub').textContent = `本形式9日 n=${r0.n.toLocaleString()}。最適と思われる打ち方で最後まで打った場合の純増(繋ぎ 8G 込み)。`;
  $('ruleLine').textContent = pre ? RULE_B + ' ' + RULE_S2 : RULE_S2;
  $('kmBox').innerHTML = kmTable(e.rows, pre) + `<p class="sub">着席G = その時点から打ち始めた場合(それまでの消化分は含まない)。初当り${pre ? '' : '・RUSH_TY'}は 1 回目の当たりの KM 値${pre ? '、点火率 = その席から 1200 に届く率' : ''}。</p>`;
}
$('terms').innerHTML = `<b>MY</b>: 底(最下点)から現在までの当日差枚の上げ幅。1200 で点火、1900 でヤメ(真の上限は 2000、推定は 50 枚ほど低く出る)。<br>
<b>最下点(MY の起点)の有利区間差枚数</b>: 基準点(朝イチ 0、または当日の切断時点の差枚)から見た底の位置。−500 より深いときだけループがある。<br>
<b>外れ</b>: 単発、1セット目 220 未満の 2連、4連型(1・2 セット目 140 未満)なのに 3連止まり。<br>
<b>${RULE_S2}</b><br><b>MY 1200 未満: ${RULE_B}</b><br><br>
数値は本形式9日(${M.honkei_days.join('、')})の実戦データで、同じデータで発見して評価した値(in-sample)。差枚は推定値(通常時 ${M.jungen}枚/G、AT 純増 3.0)。記録不良のセッションは除外。`;
render();
</script>
</body>
</html>
